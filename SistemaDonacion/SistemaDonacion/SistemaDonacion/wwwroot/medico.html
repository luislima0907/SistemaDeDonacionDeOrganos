<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Médico - Sistema Donación</title>
  <link rel="stylesheet" href="./css/dashboard.css" />
  <style>
    .message {
      background: #d4edda;
      border-left-color: #198754;
      color: #155724;
    }

    .message strong {
      color: #0f5132;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✓ Panel Médico</h1>
    <div class="message">
      <strong>¡Bienvenido, Médico!</strong> Has iniciado sesión correctamente en el rol de Médico.
    </div>
    <p>En este panel podrás:</p>
    <ul>
      <li>Registrar pacientes en lista de espera</li>
      <li>Registrar donantes</li>
      <li>Ver asignaciones de órganos</li>
    </ul>
  </div>
  <button class="logout-btn" id="btnLogout" onclick="cerrarSesion()">Cerrar sesión</button>
  <script src="./js/dashboard.js"></script>
</body>
</html>
